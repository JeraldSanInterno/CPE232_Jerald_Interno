---
- name: Pre-tasks for system updates
  hosts: all
  become: true
  pre_tasks:
    - name: install updates (CentOS)
      dnf:
        update_only: yes
        update_cache: yes
      when: ansible_distribution == "CentOS"
      tags: centos

    - name: install updates (Ubuntu)
      apt:
        update_cache: yes
      when: ansible_distribution == "Ubuntu"
      tags: ubuntu

- name: Configure Web Servers
  hosts: web_servers
  become: true
  tasks:
    - name: install apache and php for Ubuntu servers
      apt:
        name:
          - apache2
          - libapache2-mod-php
        state: latest
      when: ansible_distribution == "Ubuntu"
      tags: [ubuntu, apache]

    - name: install apache and php for CentOS servers
      dnf:
        name:
          - httpd
          - php
        state: latest
      when: ansible_distribution == "CentOS"
      tags: [centos, apache]

    - name: start and enable httpd service on CentOS
      service:
        name: httpd
        state: started
        enabled: yes
      when: ansible_distribution == "CentOS"
      tags: [centos, apache]

- name: Configure Database Servers
  hosts: db_servers
  become: true
  tasks:
    - name: install mariadb server (Ubuntu)
      apt:
        name: mariadb-server
        state: latest
      when: ansible_distribution == "Ubuntu"
      tags: [ubuntu, db]

    - name: install mariadb server (CentOS)
      dnf:
        name: mariadb-server
        state: latest
      when: ansible_distribution == "CentOS"
      tags: [centos, db]

- name: Configure File Servers
  hosts: file_servers
  become: true
  tasks:
    - name: install samba package
      package:
        name: samba
        state: latest
      tags: samba
