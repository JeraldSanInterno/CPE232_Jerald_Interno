---
- name: install apache and php (Ubuntu)
  apt:
    name:
      - apache2
      - libapache2-mod-php
    state: latest
  when: ansible_distribution == "Ubuntu"

- name: install apache and php (CentOS)
  dnf:
    name:
      - httpd
      - php
    state: latest
  when: ansible_distribution == "CentOS"

- name: start and enable httpd service (CentOS)
  service:
    name: httpd
    state: started
    enabled: yes
  when: ansible_distribution == "CentOS"
